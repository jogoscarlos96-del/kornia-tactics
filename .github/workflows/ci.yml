name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type and Svelte checks
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Phase 1 core sanity check
        run: pnpm test:phase1

      - name: Production build
        run: pnpm build
